<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шахтёр</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2c3e50;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
#game-container{background:#34495e;border-radius:20px;padding:20px;position:relative}
#game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding:15px;background:#2c3e50;border-radius:10px;gap:10px}
#game-canvas{border:3px solid #2c3e50;border-radius:10px;cursor:pointer;display:block;background:#87CEEB}
.stat{display:flex;align-items:center;gap:5px;font-weight:bold;color:#fff;background:#34495e;padding:8px 12px;border-radius:5px}
#inventory{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);border-radius:10px;padding:10px;display:flex;gap:10px;z-index:100}
.inventory-slot{width:50px;height:50px;background:#8B8B8B;border:3px solid #6B6B6B;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative}
.count{position:absolute;bottom:2px;right:5px;font-size:12px;color:#fff;font-weight:bold}
#shop-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#C6C6C6;border:4px solid #8B8B8B;border-radius:10px;padding:25px;display:none;min-width:400px;z-index:1000}
#shop-panel.active{display:block}
.shop-item{background:#D3D3D3;border:3px solid #8B8B8B;border-radius:5px;padding:15px;margin-bottom:10px;cursor:pointer}
.shop-item:hover{background:#C0C0C0}
.btn{background:#6B6B6B;color:#fff;border:3px solid #555;padding:10px 20px;border-radius:5px;cursor:pointer}
.btn:hover{background:#555}
.btn-close{background:#8B0000;float:right}
#level-complete{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);background:rgba(46,204,113,.95);color:#fff;padding:15px 30px;border-radius:10px;font-size:24px;display:none;z-index:999}
</style>
</head>
<body>
<div id="game-container">
<div id="game-header">
<div class="stat">🏆 <span id="score">0</span></div>
<div class="stat">📊 Уровень: <span id="level">1</span></div>
<div class="stat">⛏️ Кирка: <span id="pickaxe-name">Деревянная</span></div>
<button class="btn" onclick="openShop()">🛒 Магазин</button>
</div>
<canvas id="game-canvas" width="800" height="600"></canvas>
<div id="inventory"></div>
<div id="level-complete">Уровень пройден!</div>
<div id="shop-panel">
<button class="btn btn-close" onclick="closeShop()">✕</button>
<h2>🛒 Магазин улучшений</h2>
<div id="shop-items"></div>
</div>
</div>

<script>
const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');

let score=0,level=1,gameTime=0,blocks=[],particles=[],shopOpen=false;
let resources={coal:0,iron:0,gold:0,diamond:0,stone:0,emerald:0};
let upgrades={speed:1,miningSpeed:1,resourceMultiplier:1,pickaxeLevel:1};
const player={x:400,y:300,width:30,height:45,speed:5,mining:false,miningTimer:0};
const keys={};

window.addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true;
if(e.key==='b'||e.key==='B'||e.key==='и'||e.key==='И')openShop();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

const pickaxes=[
{level:1,name:'Деревянная',speed:1},
{level:2,name:'Каменная',speed:1.5},
{level:3,name:'Железная',speed:2},
{level:4,name:'Золотая',speed:3},
{level:5,name:'Алмазная',speed:5}
];

class Block{
constructor(type){
this.type=type;
this.width=40;
this.height=40;
this.x=Math.random()*(canvas.width-40);
this.y=Math.random()*(canvas.height-40);
this.isBeingMined=false;
const h={coal:5,iron:10,gold:15,diamond:30,stone:3,emerald:20}[type]||5;
const v={coal:10,iron:25,gold:50,diamond:100,stone:5,emerald:75}[type]||5;
this.hardness=h;
this.value=v;
this.hp=h;
this.maxHp=h;
}
draw(){
const c={stone:['#7D7D7D','#6B6B6B','#8B8B8B'],coal:['#3D3D3D','#2D2D2D','#4D4D4D'],iron:['#D8D8D8','#C0C0C0','#E8E8E8'],gold:['#FFD700','#DAA520','#FFE44D'],diamond:['#4AEDD9','#3BC7B5','#6FFFE9'],emerald:['#17DD62','#12B850','#33EE77']}[this.type]||['#7D7D7D','#6B6B6B','#8B8B8B'];
ctx.fillStyle=c[0];
ctx.fillRect(this.x,this.y,this.width,this.height);
ctx.strokeStyle=c[1];
ctx.lineWidth=2;
ctx.strokeRect(this.x,this.y,this.width,this.height);
if(this.hp<this.maxHp){
ctx.strokeStyle='rgba(0,0,0,.6)';
ctx.lineWidth=2;
for(let i=0;i<Math.floor((1-this.hp/this.maxHp)*5);i++){
ctx.beginPath();
let sx=this.x+Math.random()*this.width;
let sy=this.y+Math.random()*this.height;
ctx.moveTo(sx,sy);
ctx.lineTo(sx+(Math.random()-.5)*20,sy+(Math.random()-.5)*20);
ctx.stroke();
}
}
if(this.isBeingMined){
ctx.fillStyle='rgba(0,0,0,.6)';
ctx.fillRect(this.x,this.y-10,this.width,5);
ctx.fillStyle='#FFD700';
ctx.fillRect(this.x,this.y-10,this.width*(1-this.hp/this.maxHp),5);
}
}
}

function drawSteve(x,y,mining){
ctx.fillStyle='#3B5998';
ctx.fillRect(x+5,y+30,8,15);
ctx.fillRect(x+17,y+30,8,15);
ctx.fillStyle='#8B8B8B';
ctx.fillRect(x+4,y+42,9,3);
ctx.fillRect(x+16,y+42,9,3);
ctx.fillStyle='#00A8A8';
ctx.fillRect(x+5,y+15,20,15);
if(mining){
ctx.fillStyle='#FFD2A8';
ctx.fillRect(x+21,y+17,7,12);
ctx.fillStyle='#8B4513';
ctx.fillRect(x+28,y+10,3,15);
ctx.fillStyle='#C0C0C0';
ctx.fillRect(x+25,y+23,10,4);
ctx.fillStyle='#FFD2A8';
ctx.fillRect(x+3,y+17,7,12);
}else{
ctx.fillStyle='#FFD2A8';
ctx.fillRect(x+2,y+17,7,12);
ctx.fillRect(x+21,y+17,7,12);
ctx.fillStyle='#8B4513';
ctx.fillRect(x-2,y+10,3,20);
ctx.fillStyle='#C0C0C0';
ctx.fillRect(x-5,y+28,10,4);
}
ctx.fillStyle='#FFD2A8';
ctx.fillRect(x+5,y,20,15);
ctx.fillStyle='#4A2800';
ctx.fillRect(x+5,y,20,5);
ctx.fillRect(x+5,y,5,8);
ctx.fillRect(x+20,y,5,8);
ctx.fillStyle='#FFF';
ctx.fillRect(x+10,y+6,4,3);
ctx.fillRect(x+16,y+6,4,3);
ctx.fillStyle='#00F';
ctx.fillRect(x+11,y+6,2,3);
ctx.fillRect(x+17,y+6,2,3);
ctx.fillStyle='#8B4513';
ctx.fillRect(x+12,y+11,6,1);
}

function mineBlock(block,mx,my){
const d=Math.sqrt((block.x-player.x)**2+(block.y-player.y)**2);
if(d>150)return false;
if(mx>=block.x&&mx<=block.x+block.width&&my>=block.y&&my<=block.y+block.height){
block.isBeingMined=true;
block.hp-=upgrades.miningSpeed;
player.mining=true;
player.miningTimer=10;
createParticles(block.x+block.width/2,block.y+block.height/2,block.type);
if(block.hp<=0){
collectResource(block);
player.mining=false;
return true;
}
}else{
block.isBeingMined=false;
}
return false;
}

function collectResource(block){
let i=blocks.indexOf(block);
if(i>-1)blocks.splice(i,1);
let name='';
switch(block.type){
case'coal':resources.coal++;name='Уголь';break;
case'iron':resources.iron++;name='Железо';break;
case'gold':resources.gold++;name='Золото';break;
case'diamond':resources.diamond++;name='Алмаз';break;
case'stone':resources.stone+=2;name='Камень';break;
case'emerald':resources.emerald++;name='Изумруд';break;
}
score+=block.value;
updateUI();
updateInventory();
showFloatingText(block.x,block.y,'+'+block.value+' '+name);
if(score>=level*100){
level++;
document.getElementById('level-complete').style.display='block';
setTimeout(()=>{document.getElementById('level-complete').style.display='none'},2000);
initLevel();
}
}

function showFloatingText(x,y,text){
particles.push({x:x,y:y,vx:0,vy:-2,life:60,color:'#FFF',text:text});
}

canvas.addEventListener('click',e=>{
const r=canvas.getBoundingClientRect();
const sx=canvas.width/r.width;
const sy=canvas.height/r.height;
const mx=(e.clientX-r.left)*sx;
const my=(e.clientY-r.top)*sy;
for(let i=blocks.length-1;i>=0;i--){
if(mineBlock(blocks[i],mx,my))break;
}
});

function createParticles(x,y,type){
const c={stone:'#7D7D7D',coal:'#3D3D3D',iron:'#D8D8D8',gold:'#FFD700',diamond:'#4AEDD9',emerald:'#17DD62'}[type]||'#7D7D7D';
for(let i=0;i<8;i++){
particles.push({x:x,y:y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:20,color:c,text:null,size:Math.random()*3+2});
}
}

function initLevel(){
blocks=[];
for(let i=0;i<20+level*5;i++){
let type='stone',r=Math.random();
if(r<.3)type='stone';
else if(r<.5)type='coal';
else if(r<.7)type='iron';
else if(r<.85)type='gold';
else if(r<.95)type='emerald';
else type='diamond';
blocks.push(new Block(type));
}
updateUI();
}

function openShop(){
shopOpen=true;
document.getElementById('shop-panel').classList.add('active');
renderShop();
}

function closeShop(){
shopOpen=false;
document.getElementById('shop-panel').classList.remove('active');
}

function renderShop(){
const shopItems=document.getElementById('shop-items');
shopItems.innerHTML='';
const items=[
{name:'Улучшить кирку',desc:'Следующая: '+pickaxes.find(p=>p.level===upgrades.pickaxeLevel+1)?.name||'Максимум',cost:5,currency:'iron',upgrade:()=>{if(upgrades.pickaxeLevel<5){upgrades.pickaxeLevel++;const p=pickaxes.find(x=>x.level===upgrades.pickaxeLevel);upgrades.miningSpeed=p.speed;document.getElementById('pickaxe-name').textContent=p.name;}}},
{name:'Скорость',desc:'Увеличивает скорость',cost:3,currency:'gold',upgrade:()=>{upgrades.speed+=0.5;player.speed=5*upgrades.speed;}}
];
items.forEach(item=>{
const div=document.createElement('div');
div.className='shop-item';
const names={iron:'Железо',gold:'Золото'};
div.innerHTML='<h3>'+item.name+'</h3><p>'+item.desc+'</p><span>💰 '+item.cost+' '+names[item.currency]+'</span>';
div.onclick=()=>{
if(resources[item.currency]>=item.cost){
resources[item.currency]-=item.cost;
item.upgrade();
updateUI();
updateInventory();
renderShop();
}else{
alert('Недостаточно '+names[item.currency]+'!');
}
};
shopItems.appendChild(div);
});
}

function updateUI(){
document.getElementById('score').textContent=score;
document.getElementById('level').textContent=level;
}

function updateInventory(){
const inv=document.getElementById('inventory');
inv.innerHTML='';
const items=[
{icon:'🪨',name:'stone'},
{icon:'⚫',name:'coal'},
{icon:'⚙️',name:'iron'},
{icon:'🥇',name:'gold'},
{icon:'💎',name:'diamond'},
{icon:'💚',name:'emerald'}
];
items.forEach(item=>{
const slot=document.createElement('div');
slot.className='inventory-slot';
slot.innerHTML=item.icon+' <span class="count">'+resources[item.name]+'</span>';
inv.appendChild(slot);
});
}

function update(){
if(shopOpen)return;
gameTime++;
if(keys['a']||keys['arrowleft'])player.x-=player.speed;
if(keys['d']||keys['arrowright'])player.x+=player.speed;
if(keys['w']||keys['arrowup'])player.y-=player.speed;
if(keys['s']||keys['arrowdown'])player.y+=player.speed;
player.x=Math.max(0,Math.min(canvas.width-player.width,player.x));
player.y=Math.max(0,Math.min(canvas.height-player.height,player.y));
if(player.miningTimer>0){
player.miningTimer--;
if(player.miningTimer===0)player.mining=false;
}
particles=particles.filter(p=>{
if(p.text){p.y+=p.vy;p.life--}
else{p.x+=p.vx;p.y+=p.vy;p.life--}
return p.life>0;
});
if(blocks.length<10&&Math.random()<.01){
const types=['stone','coal','iron','gold','diamond','emerald'];
blocks.push(new Block(types[Math.floor(Math.random()*types.length)]));
}
}

function draw(){
ctx.fillStyle='#87CEEB';
ctx.fillRect(0,0,canvas.width,canvas.height);
blocks.forEach(b=>b.draw());
drawSteve(player.x,player.y,player.mining);
particles.forEach(p=>{
ctx.globalAlpha=p.life/30;
if(p.text){
ctx.fillStyle=p.color;
ctx.font='bold 16px Arial';
ctx.textAlign='center';
ctx.fillText(p.text,p.x,p.y);
}else{
ctx.fillStyle=p.color;
ctx.fillRect(p.x,p.y,p.size||5,p.size||5);
}
ctx.globalAlpha=1;
});
}

function gameLoop(){
update();
draw();
requestAnimationFrame(gameLoop);
}

updateUI();
updateInventory();
initLevel();
gameLoop();
</script>
</body>
</html>
