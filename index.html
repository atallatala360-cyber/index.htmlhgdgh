<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Шахтёр - Minecraft Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #game-container {
            background: #34495e;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            padding: 20px;
            position: relative;
            max-width: 100vw;
            max-height: 100vh;
        }

        #game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            background: #2c3e50;
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        #game-canvas {
            border: 3px solid #2c3e50;
            border-radius: 10px;
            cursor: pointer;
            display: block;
            background: #87CEEB;
            max-width: 100%;
            height: auto;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            color: #ecf0f1;
            background: #34495e;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
        }

        #inventory {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            gap: 10px;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
        }

        .inventory-slot {
            width: 50px;
            height: 50px;
            background: #8B8B8B;
            border: 3px solid #6B6B6B;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            position: relative;
        }

        .count {
            position: absolute;
            bottom: 2px;
            right: 5px;
            font-size: 12px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 2px #000;
        }

        #shop-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #C6C6C6;
            border: 4px solid #8B8B8B;
            border-radius: 10px;
            padding: 25px;
            display: none;
            min-width: 400px;
            max-width: 90%;
            z-index: 1000;
            color: #333;
            max-height: 80vh;
            overflow-y: auto;
        }

        #shop-panel.active {
            display: block;
        }

        .shop-item {
            background: #D3D3D3;
            border: 3px solid #8B8B8B;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .shop-item:hover {
            background: #C0C0C0;
            border-color: #555;
        }

        .btn {
            background: #6B6B6B;
            color: white;
            border: 3px solid #555;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            touch-action: manipulation;
        }

        .btn:hover {
            background: #555;
        }

        .btn-close {
            background: #8B0000;
            float: right;
        }

        #level-complete, #achievement-popup {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(46, 204, 113, 0.95);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 24px;
            display: none;
            z-index: 999;
            text-align: center;
        }

        #achievement-popup {
            background: rgba(241, 196, 15, 0.95);
            color: #333;
            font-size: 18px;
            top: 20%;
        }

        #mobile-controls {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            z-index: 90;
            gap: 10px;
        }

        .mobile-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
        }

        .mobile-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }

        #leaderboard-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2c3e50;
            border: 4px solid #8B8B8B;
            border-radius: 10px;
            padding: 25px;
            display: none;
            min-width: 300px;
            max-width: 90%;
            z-index: 1000;
            color: white;
            max-height: 80vh;
            overflow-y: auto;
        }

        #leaderboard-panel.active {
            display: block;
        }

        .leaderboard-entry {
            background: #34495e;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }

        #sound-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        @media (max-width: 768px) {
            #game-container {
                padding: 10px;
            }
            
            #game-header {
                padding: 10px;
                gap: 5px;
            }
            
            .stat {
                padding: 5px 8px;
                font-size: 12px;
            }
            
            #mobile-controls {
                display: flex;
            }
            
            #game-canvas {
                max-width: 100%;
            }
        }

        @media (pointer: coarse) {
            #mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <button id="sound-toggle" onclick="toggleSound()">🔊</button>
        
        <div id="game-header">
            <div class="stat">🏆 <span id="score">0</span></div>
            <div class="stat">📊 Уровень: <span id="level">1</span></div>
            <div class="stat">⛏️ <span id="pickaxe-name">Деревянная кирка</span></div>
            <button class="btn" onclick="openShop()">🛒 Магазин</button>
            <button class="btn" onclick="openLeaderboard()">🏆 Рекорды</button>
        </div>
        
        <canvas id="game-canvas" width="800" height="600"></canvas>
        
        <div id="inventory"></div>
        
        <div id="mobile-controls">
            <div class="mobile-btn" id="btn-up">⬆️</div>
            <div class="mobile-btn" id="btn-left">⬅️</div>
            <div class="mobile-btn" id="btn-down">⬇️</div>
            <div class="mobile-btn" id="btn-right">➡️</div>
        </div>
        
        <div id="level-complete">Уровень пройден!</div>
        <div id="achievement-popup"></div>
        
        <div id="shop-panel">
            <button class="btn btn-close" onclick="closeShop()">✕</button>
            <h2>🛒 Магазин улучшений</h2>
            <div id="shop-items"></div>
        </div>
        
        <div id="leaderboard-panel">
            <button class="btn btn-close" onclick="closeLeaderboard()">✕</button>
            <h2>🏆 Таблица лидеров</h2>
            <div id="leaderboard-entries"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        // Загрузка сохранений
        let score = parseInt(localStorage.getItem('miner_score') || '0');
        let level = parseInt(localStorage.getItem('miner_level') || '1');
        let gameTime = 0;
        let blocks = [];
        let particles = [];
        let shopOpen = false;
        let soundEnabled = localStorage.getItem('miner_sound') !== 'off';
        
        let resources = JSON.parse(localStorage.getItem('miner_resources') || '{"coal":0,"iron":0,"gold":0,"diamond":0,"stone":0,"emerald":0}');
        let upgrades = JSON.parse(localStorage.getItem('miner_upgrades') || '{"speed":1,"miningSpeed":1,"resourceMultiplier":1,"pickaxeLevel":1,"luck":0}');
        
        let achievements = JSON.parse(localStorage.getItem('miner_achievements') || '[]');
        let leaderboard = JSON.parse(localStorage.getItem('miner_leaderboard') || '[]');
        
        const player = {
            x: 400,
            y: 300,
            width: 30,
            height: 45,
            speed: 5 * upgrades.speed,
            facing: 'right',
            walking: false,
            mining: false,
            miningTimer: 0
        };
        
        // Звуки
        const sounds = {
            mine: null,
            collect: null,
            achievement: null,
            levelup: null
        };
        
        function initSounds() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                sounds.mine = () => {
                    if (!soundEnabled) return;
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.value = 200;
                    gain.gain.value = 0.1;
                    osc.start();
                    setTimeout(() => {
                        osc.stop();
                    }, 100);
                };
                
                sounds.collect = () => {
                    if (!soundEnabled) return;
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.value = 600;
                    gain.gain.value = 0.1;
                    osc.start();
                    setTimeout(() => {
                        osc.stop();
                    }, 200);
                };
                
                sounds.achievement = () => {
                    if (!soundEnabled) return;
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.value = 800;
                    gain.gain.value = 0.1;
                    osc.start();
                    setTimeout(() => {
                        osc.stop();
                    }, 500);
                };
                
                sounds.levelup = () => {
                    if (!soundEnabled) return;
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.value = 400;
                    gain.gain.value = 0.1;
                    osc.start();
                    setTimeout(() => {
                        osc.stop();
                    }, 800);
                };
            } catch (e) {
                console.log('Audio not supported');
            }
        }
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('miner_sound', soundEnabled ? 'on' : 'off');
            document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';
        }
        
        // Достижения
        const achievementList = [
            { id: 'first_block', name: 'Первая добыча!', desc: 'Добудьте первый блок', check: () => score > 0 },
            { id: 'stone_master', name: 'Каменщик', desc: 'Добудьте 100 камня', check: () => resources.stone >= 100 },
            { id: 'coal_miner', name: 'Угольщик', desc: 'Добудьте 50 угля', check: () => resources.coal >= 50 },
            { id: 'iron_miner', name: 'Кузнец', desc: 'Добудьте 30 железа', check: () => resources.iron >= 30 },
            { id: 'gold_miner', name: 'Золотоискатель', desc: 'Добудьте 20 золота', check: () => resources.gold >= 20 },
            { id: 'diamond_miner', name: 'Алмазный магнат', desc: 'Добудьте 10 алмазов', check: () => resources.diamond >= 10 },
            { id: 'emerald_miner', name: 'Изумрудный король', desc: 'Добудьте 10 изумрудов', check: () => resources.emerald >= 10 },
            { id: 'level_5', name: 'Опытный шахтёр', desc: 'Достигните 5 уровня', check: () => level >= 5 },
            { id: 'level_10', name: 'Легенда шахт', desc: 'Достигните 10 уровня', check: () => level >= 10 },
            { id: 'rich', name: 'Богач', desc: 'Наберите 10000 очков', check: () => score >= 10000 }
        ];
        
        function checkAchievements() {
            achievementList.forEach(ach => {
                if (!achievements.includes(ach.id) && ach.check()) {
                    achievements.push(ach.id);
                    showAchievement(ach.name, ach.desc);
                    if (sounds.achievement) sounds.achievement();
                    localStorage.setItem('miner_achievements', JSON.stringify(achievements));
                }
            });
        }
        
        function showAchievement(name, desc) {
            const popup = document.getElementById('achievement-popup');
            popup.innerHTML = `🎉 Достижение!<br>${name}<br><small>${desc}</small>`;
            popup.style.display = 'block';
            setTimeout(() => {
                popup.style.display = 'none';
            }, 3000);
        }
        
        // Таблица лидеров
        function openLeaderboard() {
            document.getElementById('leaderboard-panel').classList.add('active');
            renderLeaderboard();
        }
        
        function closeLeaderboard() {
            document.getElementById('leaderboard-panel').classList.remove('active');
        }
        
        function saveToLeaderboard() {
            const entry = {
                name: prompt('Введите ваше имя:') || 'Игрок',
                score: score,
                level: level,
                date: new Date().toLocaleDateString()
            };
            
            leaderboard.push(entry);
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 10);
            localStorage.setItem('miner_leaderboard', JSON.stringify(leaderboard));
            renderLeaderboard();
        }
        
        function renderLeaderboard() {
            const entries = document.getElementById('leaderboard-entries');
            entries.innerHTML = '';
            
            if (leaderboard.length === 0) {
                entries.innerHTML = '<p>Пока нет записей. Играйте и попадите в топ!</p>';
                return;
            }
            
            leaderboard.forEach((entry, index) => {
                const div = document.createElement('div');
                div.className = 'leaderboard-entry';
                div.innerHTML = `
                    <span>${index + 1}. ${entry.name}</span>
                    <span>🏆 ${entry.score}</span>
                    <span>📊 ${entry.level} ур.</span>
                `;
                entries.appendChild(div);
            });
        }
        
        // Кирки
        const pickaxes = [
            { level: 1, name: 'Деревянная кирка', speed: 1, color: '#8B4513' },
            { level: 2, name: 'Каменная кирка', speed: 1.5, color: '#808080' },
            { level: 3, name: 'Железная кирка', speed: 2, color: '#D3D3D3' },
            { level: 4, name: 'Золотая кирка', speed: 3, color: '#FFD700' },
            { level: 5, name: 'Алмазная кирка', speed: 5, color: '#00FFFF' }
        ];
        
        function updatePickaxe() {
            const currentPickaxe = pickaxes.find(p => p.level === upgrades.pickaxeLevel) || pickaxes[0];
            upgrades.miningSpeed = currentPickaxe.speed;
            document.getElementById('pickaxe-name').textContent = currentPickaxe.name;
            localStorage.setItem('miner_upgrades', JSON.stringify(upgrades));
        }
        
        // Управление
        const keys = {};
        const mobileKeys = {};
        
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'b' || e.key === 'B' || e.key === 'и' || e.key === 'И') {
                openShop();
            }
            if (e.key === 'l' || e.key === 'L' || e.key === 'д' || e.key === 'Д') {
                openLeaderboard();
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });
        
        // Мобильное управление
        const mobileButtons = {
            'btn-up': 'w',
            'btn-down': 's',
            'btn-left': 'a',
            'btn-right': 'd'
        };
        
        Object.keys(mobileButtons).forEach(btnId => {
            const btn = document.getElementById(btnId);
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keys[mobileButtons[btnId]] = true;
            });
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[mobileButtons[btnId]] = false;
            });
            btn.addEventListener('mousedown', () => {
                keys[mobileButtons[btnId]] = true;
            });
            btn.addEventListener('mouseup', () => {
                keys[mobileButtons[btnId]] = false;
            });
        });
        
        // Класс блока
        class Block {
            constructor(type) {
                this.type = type;
                this.width = 40;
                this.height = 40;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = Math.random() * (canvas.height - this.height);
                this.isBeingMined = false;
                
                const hardnessMap = { coal: 5, iron: 10, gold: 15, diamond: 30, stone: 3, emerald: 20 };
                const valueMap = { coal: 10, iron: 25, gold: 50, diamond: 100, stone: 5, emerald: 75 };
                
                this.hardness = hardnessMap[type] || 5;
                this.value = valueMap[type] || 5;
                this.hp = this.hardness;
                this.maxHp = this.hardness;
            }
            
            draw() {
                const colors = {
                    stone: ['#7D7D7D', '#6B6B6B', '#8B8B8B'],
                    coal: ['#3D3D3D', '#2D2D2D', '#4D4D4D'],
                    iron: ['#D8D8D8', '#C0C0C0', '#E8E8E8'],
                    gold: ['#FFD700', '#DAA520', '#FFE44D'],
                    diamond: ['#4AEDD9', '#3BC7B5', '#6FFFE9'],
                    emerald: ['#17DD62', '#12B850', '#33EE77']
                }[this.type] || ['#7D7D7D', '#6B6B6B', '#8B8B8B'];
                
                ctx.fillStyle = colors[0];
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                for (let i = 0; i < 8; i++) {
                    ctx.fillStyle = colors[Math.floor(Math.random() * 3)];
                    ctx.fillRect(this.x + Math.random() * (this.width - 4), this.y + Math.random() * (this.height - 4), 3, 3);
                }
                
                ctx.strokeStyle = colors[1];
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
                
                if (this.hp < this.maxHp) {
                    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
                    ctx.lineWidth = 2;
                    for (let i = 0; i < Math.floor((1 - this.hp / this.maxHp) * 5); i++) {
                        ctx.beginPath();
                        let sx = this.x + Math.random() * this.width;
                        let sy = this.y + Math.random() * this.height;
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(sx + (Math.random() - 0.5) * 20, sy + (Math.random() - 0.5) * 20);
                        ctx.stroke();
                    }
                }
                
                if (this.isBeingMined) {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(this.x, this.y - 10, this.width, 5);
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(this.x, this.y - 10, this.width * (1 - this.hp / this.maxHp), 5);
                }
            }
        }
        
        // Отрисовка Стива
        function drawSteve(x, y, facing, walking, mining) {
            ctx.fillStyle = '#3B5998';
            ctx.fillRect(x + 5, y + 30, 8, 15);
            ctx.fillRect(x + 17, y + 30, 8, 15);
            
            ctx.fillStyle = '#8B8B8B';
            ctx.fillRect(x + 4, y + 42, 9, 3);
            ctx.fillRect(x + 16, y + 42, 9, 3);
            
            ctx.fillStyle = '#00A8A8';
            ctx.fillRect(x + 5, y + 15, 20, 15);
            
            if (mining) {
                ctx.save();
                ctx.translate(x + 25, y + 17);
                ctx.rotate(-0.5 + Math.sin(gameTime * 0.5) * 0.3);
                ctx.fillStyle = '#FFD2A8';
                ctx.fillRect(-3, 0, 7, 12);
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(0, 10, 3, 15);
                ctx.fillStyle = '#C0C0C0';
                ctx.fillRect(-4, 23, 10, 4);
                ctx.restore();
                ctx.fillStyle = '#FFD2A8';
                ctx.fillRect(x + 3, y + 17, 7, 12);
            } else {
                ctx.fillStyle = '#FFD2A8';
                ctx.fillRect(x + 2, y + 17, 7, 12);
                ctx.fillRect(x + 21, y + 17, 7, 12);
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(x - 2, y + 10, 3, 20);
                ctx.fillStyle = '#C0C0C0';
                ctx.fillRect(x - 5, y + 28, 10, 4);
            }
            
            ctx.fillStyle = '#FFD2A8';
            ctx.fillRect(x + 5, y, 20, 15);
            
            ctx.fillStyle = '#4A2800';
            ctx.fillRect(x + 5, y, 20, 5);
            ctx.fillRect(x + 5, y, 5, 8);
            ctx.fillRect(x + 20, y, 5, 8);
            
            ctx.fillStyle = '#FFF';
            ctx.fillRect(x + 10, y + 6, 4, 3);
            ctx.fillRect(x + 16, y + 6, 4, 3);
            ctx.fillStyle = '#00F';
            ctx.fillRect(x + 11, y + 6, 2, 3);
            ctx.fillRect(x + 17, y + 6, 2, 3);
            
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(x + 12, y + 11, 6, 1);
        }
        
        // Добыча
        function mineBlock(block, mx, my) {
            const distance = Math.sqrt((block.x - player.x) ** 2 + (block.y - player.y) ** 2);
            if (distance > 150) return false;
            
            if (mx >= block.x && mx <= block.x + block.width && my >= block.y && my <= block.y + block.height) {
                block.isBeingMined = true;
                block.hp -= upgrades.miningSpeed;
                player.mining = true;
                player.miningTimer = 10;
                
                createParticles(block.x + block.width / 2, block.y + block.height / 2, block.type);
                if (sounds.mine) sounds.mine();
                
                if (block.hp <= 0) {
                    collectResource(block);
                    player.mining = false;
                    return true;
                }
            } else {
                block.isBeingMined = false;
            }
            
            return false;
        }
        
        function collectResource(block) {
            const index = blocks.indexOf(block);
            if (index > -1) blocks.splice(index, 1);
            
            let name = '';
            switch (block.type) {
                case 'coal':
                    resources.coal += Math.ceil(upgrades.resourceMultiplier);
                    name = 'Уголь';
                    break;
                case 'iron':
                    resources.iron += Math.ceil(upgrades.resourceMultiplier);
                    name = 'Железо';
                    break;
                case 'gold':
                    resources.gold += Math.ceil(upgrades.resourceMultiplier);
                    name = 'Золото';
                    break;
                case 'diamond':
                    resources.diamond += Math.ceil(upgrades.resourceMultiplier);
                    name = 'Алмаз';
                    break;
                case 'stone':
                    resources.stone += Math.ceil(upgrades.resourceMultiplier * 2);
                    name = 'Камень';
                    break;
                case 'emerald':
                    resources.emerald += Math.ceil(upgrades.resourceMultiplier);
                    name = 'Изумруд';
                    break;
            }
            
            score += block.value;
            if (sounds.collect) sounds.collect();
            
            localStorage.setItem('miner_score', score);
            localStorage.setItem('miner_level', level);
            localStorage.setItem('miner_resources', JSON.stringify(resources));
            
            updateUI();
            updateInventory();
            showFloatingText(block.x, block.y, `+${block.value} ${name}`);
            checkAchievements();
            
            if (score >= level * 100) {
                level++;
                if (sounds.levelup) sounds.levelup();
                document.getElementById('level-complete').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('level-complete').style.display = 'none';
                }, 2000);
                initLevel();
            }
        }
        
        function showFloatingText(x, y, text) {
            particles.push({
                x: x, y: y, vx: 0, vy: -2, life: 60,
                color: '#FFFFFF', text: text
            });
        }
        
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;
            
            for (let i = blocks.length - 1; i >= 0; i--) {
                if (mineBlock(blocks[i], mx, my)) break;
            }
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const touch = e.touches[0];
            const mx = (touch.clientX - rect.left) * scaleX;
            const my = (touch.clientY - rect.top) * scaleY;
            
            for (let i = blocks.length - 1; i >= 0; i--) {
                if (mineBlock(blocks[i], mx, my)) break;
            }
        });
        
        function createParticles(x, y, type) {
            const colors = {
                stone: '#7D7D7D', coal: '#3D3D3D', iron: '#D8D8D8',
                gold: '#FFD700', diamond: '#4AEDD9', emerald: '#17DD62'
            };
            const color = colors[type] || '#7D7D7D';
            
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 20, color: color, text: null,
                    size: Math.random() * 3 + 2
                });
            }
        }
        
        function initLevel() {
            blocks = [];
            const blockCount = 20 + level * 5;
            
            for (let i = 0; i < blockCount; i++) {
                let type = 'stone';
                const rand = Math.random();
                
                if (rand < 0.3) type = 'stone';
                else if (rand < 0.5) type = 'coal';
                else if (rand < 0.7) type = 'iron';
                else if (rand < 0.85) type = 'gold';
                else if (rand < 0.95) type = 'emerald';
                else type = 'diamond';
                
                blocks.push(new Block(type));
            }
            
            updateUI();
        }

            document.getElementById('shop-panel').classList.add('active');
